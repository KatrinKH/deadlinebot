# Список предметов и треков. Читается при каждом запуске бота:
# - недостающие предметы и треки добавляются;
# - существующие треки и разделы предметов приводятся к этому файлу,
#   подписки студентов обновляются (если SEED_SYNC_TRACKS=true в .env);
# - предметы и треки, удалённые из файла, остаются в базе — по ним могут быть дедлайны.
#
# subjects — предметы по разделам. Раздел = кнопка в меню выбора предметов,
# порядок разделов здесь = порядок в боте. Названия разделов можно менять.
# Предмет, обязательный в одном треке, может быть по выбору в другом —
# тогда студенты этого трека увидят его в его разделе.
#
# tracks — треки. mandatory: обязательные для всех студентов трека.
# choose_one: группы «выбери один» — например, Python или Java;
# бот спросит при регистрации, что именно студент изучает.
# hidden: предметы, которые студентам трека недоступны и не показываются.

subjects:
  Основные курсы:
    - Системный анализ для разработчиков
    - Алгоритмы и структуры данных. Часть 1
    - Язык программирования Python
    - Язык программирования Java
    - Инструменты разработчика
    - Навыки взаимодействия в командах разработки
    - Системы управления базами данных

  # TODO: проверить, в каком разделе какой предмет
  Факультативы:
    - ИИ-инструменты для разработчиков
    - Управление разработкой ИТ продукта
    - Mock-interview

  Soft skills:
    - Переговоры
    - Публичные выступления

  Интенсивы:
    - Рост грейда

tracks:
  - name: Обычный
    mandatory:
      - Алгоритмы и структуры данных. Часть 1
      - Инструменты разработчика
      - Навыки взаимодействия в командах разработки
    choose_one:
      - [Язык программирования Python, Язык программирования Java]
      - [Переговоры, Публичные выступления]
    hidden:
      - Системный анализ для разработчиков
      - Системы управления базами данных

  - name: Тимлидский
    mandatory:
      - Системный анализ для разработчиков
      - Алгоритмы и структуры данных. Часть 1
      - Инструменты разработчика
      - Системы управления базами данных
    # Начнутся со 2 семестра — пока не показываем. Python и Java у тимлидов
    # идут как предметы по выбору, поэтому их здесь нет.
    hidden:
      - Навыки взаимодействия в командах разработки
      - Переговоры
      - Публичные выступления

  - name: Обычный + Magnit Tech
    mandatory:
      - Системный анализ для разработчиков
      - Алгоритмы и структуры данных. Часть 1
      - Инструменты разработчика
      - Навыки взаимодействия в командах разработки
    choose_one:
      - [Язык программирования Python, Язык программирования Java]
      - [Переговоры, Публичные выступления]
    hidden:
      - Системы управления базами данных
