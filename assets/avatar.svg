<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E1B4B" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <!-- листок календаря -->
  <g filter="url(#sh)">
    <rect x="170" y="180" width="300" height="290" rx="36" fill="#FFFFFF"/>
    <path d="M170 216 a36 36 0 0 1 36 -36 h228 a36 36 0 0 1 36 36 v44 h-300 z" fill="#FF6B5B"/>
  </g>
  <!-- кольца -->
  <rect x="232" y="150" width="22" height="62" rx="11" fill="#FFFFFF" stroke="#312E81" stroke-width="8"/>
  <rect x="386" y="150" width="22" height="62" rx="11" fill="#FFFFFF" stroke="#312E81" stroke-width="8"/>
  <!-- галочка -->
  <path d="M245 360 l48 48 l100 -100" fill="none" stroke="#4F46E5" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- часы -->
  <g filter="url(#sh)">
    <circle cx="452" cy="452" r="66" fill="#FBBF24" stroke="#FFFFFF" stroke-width="12"/>
  </g>
  <path d="M452 418 v36 l24 16" fill="none" stroke="#312E81" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
